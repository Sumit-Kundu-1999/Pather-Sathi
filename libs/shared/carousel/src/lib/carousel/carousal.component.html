<div id="specialCareCarousel" class="carousel slide carousel-fade shadow-lg rounded-4 overflow-hidden"
  data-bs-ride="carousel">
  <div class="carousel-inner">
    <div *ngFor="let slide of carouselService.slides(); let i = index" class="carousel-item" [class.active]="i === 0">

      <!-- Responsive Child Photo Background -->
      <img [src]="slide.path" class="d-block w-100 responsive-carousel-img" [alt]="slide.altText || 'Special Child Photo'">

      <!-- Subtle Soft Gradient Overlay: Keeps Child Photo Clearly Visible While Providing Text Contrast -->
      <div class="subtle-photo-overlay"></div>

      <!-- Carousel Caption: Centered on all screens -->
      <div class="carousel-caption seamless-caption">
        <h2 class="fw-bold mb-3 mb-sm-4 text-white cinematic-text">Disease - {{ slide.diseaseName }}</h2>
        
        <!-- Buttons Group: Perfectly Centered on Mobile & Desktop -->
        <div class="carousel-btn-group d-flex flex-column flex-sm-row justify-content-center align-items-center gap-3">

          <button (click)="goToDetail(slide._id)" 
                  class="btn btn-carousel-details rounded-pill fw-bold px-4 py-2">
            View Details <i class="bi bi-arrow-right ms-1"></i>
          </button>

          <a href="tel:{{ slide.phoneNumber }}" 
             class="btn btn-carousel-phone rounded-pill fw-bold px-4 py-2">
            <i class="bi bi-telephone-fill me-2"></i> {{ slide.phoneNumber }}
          </a>

        </div>
      </div>
    </div>

    <div *ngIf="carouselService.slides().length === 0" class="text-center p-5 bg-light">
      <div class="spinner-border text-success" role="status"></div>
      <p class="mt-3 text-muted">Loading initiatives...</p>
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#specialCareCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#specialCareCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
