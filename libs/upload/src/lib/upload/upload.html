<div class="upload-container">
  <h2>Upload Event Photo</h2>
  
  <div class="form-group">
    <label for="eventName">Event Name *</label>
    <input 
      type="text" 
      id="eventName" 
      [(ngModel)]="eventName" 
      placeholder="e.g., Durga Puja Drive 2026"
      [disabled]="isUploading()">
  </div>

  <div class="form-group">
    <label for="altText">Description / Alt Text</label>
    <input 
      type="text" 
      id="altText" 
      [(ngModel)]="altText" 
      placeholder="Briefly describe the photo"
      [disabled]="isUploading()">
  </div>

  <div class="form-group">
    <label for="fileUpload">Select Image (Max 2MB) *</label>
    <!-- accept="image/*" restricts the file picker dialog to images only -->
    <input 
      type="file" 
      id="fileUpload" 
      (change)="onFileSelected($event)" 
      accept="image/*"
      multiple
      [disabled]="isUploading()">
  </div>

  @if (errorMessage) {
    <div class="message error">{{ errorMessage }}</div>
  }
  @if (successMessage) {
    <div class="message success">{{ successMessage }}</div>
  }

  <button 
    class="btn-upload" 
    (click)="onUpload()" 
    [disabled]="isUploading() || selectedFiles.length == 0 || !eventName">
    {{ isUploading() ? 'Uploading...' : 'Upload Photo' }}
  </button>
</div>
